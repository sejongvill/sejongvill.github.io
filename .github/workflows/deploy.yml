name: 홈페이지 만들기
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pyyaml markdown
      - name: 큰 사진 자동으로 줄이기
        run: |
          python build/shrink_uploads.py
          if [ -n "$(git status --porcelain static/files/uploads)" ]; then
            git config user.name "sejongvill-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/files/uploads
            git commit -m "사진 용량 자동 줄이기"
            git pull --rebase && git push || echo "다음 번에 다시 시도"
          fi
      - run: python build/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
