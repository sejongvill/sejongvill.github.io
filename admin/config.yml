# 세종빌 글쓰기 화면 설정 (로그인: DecapBridge 이메일·비밀번호)
backend:
  name: git-gateway
  repo: sejongvill/sejongvill.github.io
  branch: main
  identity_url: https://auth.decapbridge.com/sites/4f7f1434-deb1-4975-8034-86cc185eb0b8
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: '{{collection}} 새 글 “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    update: '{{collection}} 글 수정 “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: '{{collection}} 글 삭제 “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 파일 올리기 “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: 파일 삭제 “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: '{{message}} - {{author-name}} <{{author-login}}> via DecapBridge'
locale: ko
site_url: https://www.xn--ix3bl7ch6i.com
display_url: https://www.xn--ix3bl7ch6i.com
logo_url: /assets/img/logo.png
media_folder: static/files/uploads
public_folder: /files/uploads
collections:
- name: stories
  label: 일상 이야기
  label_singular: 일상 이야기
  folder: content/stories
  create: true
  delete: true
  slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
  extension: md
  format: frontmatter
  summary: '{{date | date(''YYYY-MM-DD'')}}  {{title}}'
  sortable_fields:
  - date
  - title
  fields:
  - label: 제목
    name: title
    widget: string
  - label: 날짜
    name: date
    widget: datetime
    format: YYYY-MM-DD HH:mm
    date_format: YYYY-MM-DD
    time_format: HH:mm
  - label: 글쓴이
    name: author
    widget: hidden
    required: false
  - label: 사진
    name: images
    widget: list
    required: false
    hint: 사진을 여러 장 올릴 수 있어요. 첫 번째 사진이 목록에 대표로 보여요.
    field:
      label: 사진
      name: image
      widget: image
      choose_url: false
  - label: 내용
    name: body
    widget: markdown
    required: false
    buttons:
    - bold
    - link
    - bulleted-list
    - numbered-list
    editor_components:
    - image
  - label: 첨부파일
    name: files
    widget: list
    required: false
    hint: 한글·PDF·엑셀 파일 등을 올리면 글 아래에서 내려받을 수 있어요.
    fields:
    - label: 파일
      name: file
      widget: file
      choose_url: false
    - label: 표시 이름 (비워두면 파일 이름)
      name: name
      widget: string
      required: false
